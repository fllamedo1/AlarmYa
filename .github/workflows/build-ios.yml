name: build-ios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - "assets/**"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"

      - name: Dependencias
        run: flutter pub get

      - name: Compilar iOS (sin firmar)
        run: |
          flutter build ios --release --no-codesign --config-only
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Empaquetar IPA
        run: |
          APP_PATH=$(find build/ios -path "*/Release-iphoneos/Runner.app" -print -quit)
          mkdir -p build/ios/iphoneos/Payload
          cp -r "$APP_PATH" build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qry AlarmIA-unsigned.ipa Payload

      - name: Subir IPA como artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmIA-ipa
          path: build/ios/iphoneos/AlarmIA-unsigned.ipa
          retention-days: 30
